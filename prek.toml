default_install_hook_types = ["pre-commit"]

[[repos]]
repo = "builtin"
hooks = [
  { id = "check-toml" },
  { id = "check-yaml" },
  { id = "end-of-file-fixer" },
  { id = "trailing-whitespace" },
  { id = "check-merge-conflict" },
  { id = "detect-private-key" },
]

[[repos]]
repo = "local"
hooks = [
  {
    id = "python-sdk-ruff-check",
    name = "Python SDK Ruff lint",
    language = "system",
    entry = "uv run --project sdks/python ruff check --config sdks/python/pyproject.toml sdks/python/src sdks/python/tests examples/python tests/contract tools",
    files = "^(sdks/python|examples/python|tests/contract|tools)/",
    pass_filenames = false,
  },
  {
    id = "python-sdk-ruff-format-check",
    name = "Python SDK Ruff format check",
    language = "system",
    entry = "uv run --project sdks/python ruff format --check --config sdks/python/pyproject.toml sdks/python/src sdks/python/tests examples/python tests/contract tools",
    files = "^(sdks/python|examples/python|tests/contract|tools)/",
    pass_filenames = false,
  },
  {
    id = "python-sdk-ty-check",
    name = "Python SDK ty typecheck",
    language = "system",
    entry = "uv run --project sdks/python ty check --project sdks/python sdks/python/src sdks/python/tests examples/python tests/contract",
    files = "^(sdks/python|examples/python|tests/contract)/",
    pass_filenames = false,
  },
  {
    id = "python-sdk-tests",
    name = "Python SDK tests",
    language = "system",
    entry = "uv run --project sdks/python pytest -c sdks/python/pyproject.toml sdks/python/tests",
    files = "^(sdks/python|examples/python)/",
    pass_filenames = false,
  },
  # Lint and format are repository-wide: one root ESLint config and one root
  # Prettier config cover every workspace, so these run on any change that a
  # root config or any linted source file could affect.
  {
    id = "workspace-lint",
    name = "ESLint (all workspaces)",
    language = "system",
    entry = "npm run lint",
    files = "\\.(cjs|js|mjs|ts|tsx)$|^(eslint\\.config\\.mjs|package\\.json|package-lock\\.json|tsconfig\\.base\\.json)$",
    pass_filenames = false,
  },
  {
    id = "workspace-format",
    name = "Prettier check (all workspaces)",
    language = "system",
    entry = "npm run format",
    files = "\\.(cjs|js|json|md|mjs|ts|tsx|yaml|yml)$",
    exclude = "^sdks/python/",
    pass_filenames = false,
  },
  # Contract conformance is cross-language, so it runs on a change to either
  # SDK's routing table, to the shared assertions, or to the committed contract
  # snapshot. `test:contract` is hermetic; the network-dependent
  # `test:published-contract` drift alarm is CI-only on purpose.
  {
    id = "contract-conformance",
    name = "Contract conformance (both SDKs)",
    language = "system",
    entry = "npm run test:contract",
    files = "^(tests/(contract|fixtures)/|sdks/typescript/src/(operations|generated)|sdks/python/src/octogen_ai_sdk/operations|vitest\\.config\\.ts$|tsconfig\\.contract\\.json$)",
    pass_filenames = false,
  },
  {
    id = "contract-conformance-python",
    name = "Contract conformance (Python runner)",
    language = "system",
    entry = "uv run --project sdks/python pytest -c sdks/python/pyproject.toml tests/contract",
    files = "^(tests/(contract|fixtures)/|sdks/python/src/octogen_ai_sdk/operations)",
    pass_filenames = false,
  },
  {
    id = "codegen-up-to-date",
    name = "Generated types match the contract snapshot",
    language = "system",
    entry = "npm run codegen:check",
    files = "^(tests/fixtures/openapi/|tools/codegen/|sdks/typescript/src/generated/|sdks/python/src/octogen_ai_sdk/generated/)",
    pass_filenames = false,
  },
  # Per-package typecheck/test/build stay gated on that package's own paths, so
  # a CLI-only change does not run the SDK suite and vice versa.
  {
    id = "typescript-sdk-typecheck",
    name = "TypeScript SDK typecheck",
    language = "system",
    entry = "npm run typecheck --workspace sdks/typescript",
    files = "^(sdks/typescript|examples/typescript)/|^tsconfig\\.base\\.json$",
    pass_filenames = false,
  },
  {
    id = "contract-typecheck",
    name = "Contract tests typecheck",
    language = "system",
    entry = "npm run typecheck:contract",
    files = "^(tests/contract|sdks/typescript/src)/|^(tsconfig\\.base|tsconfig\\.contract)\\.json$|^vitest(\\.published)?\\.config\\.ts$",
    pass_filenames = false,
  },
  {
    id = "typescript-sdk-tests",
    name = "TypeScript SDK tests",
    language = "system",
    entry = "npm run test --workspace sdks/typescript",
    files = "^(sdks/typescript|examples/typescript)/|^tsconfig\\.base\\.json$",
    pass_filenames = false,
  },
  {
    id = "typescript-sdk-build",
    name = "TypeScript SDK build",
    language = "system",
    entry = "npm run build --workspace sdks/typescript",
    files = "^(sdks/typescript|examples/typescript)/|^tsconfig\\.base\\.json$",
    pass_filenames = false,
  },
  # The `cli` workspace does not exist yet (design P4). These hooks are inert
  # until it does: their `files` patterns match nothing, so they never run.
  {
    id = "cli-typecheck",
    name = "CLI typecheck",
    language = "system",
    entry = "npm run typecheck --workspace cli",
    files = "^cli/",
    pass_filenames = false,
  },
  {
    id = "cli-tests",
    name = "CLI tests",
    language = "system",
    entry = "npm run test --workspace cli",
    files = "^cli/",
    pass_filenames = false,
  },
  {
    id = "cli-build",
    name = "CLI build",
    language = "system",
    entry = "npm run build --workspace cli",
    files = "^cli/",
    pass_filenames = false,
  },
]
