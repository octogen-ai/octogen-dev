# Continuous integration for octogen-dev.
#
# Every command here is a command `prek.toml` also runs locally, so a green PR
# and a clean `prek run --all-files` mean the same thing. Hooks only protect the
# machines they are installed on; this workflow is what protects `main`.
name: CI

on:
  # Every pull request, not just those targeting `main`: a stacked PR is
  # exactly the change most likely to need checking, and filtering by target
  # branch silently gives it no CI at all.
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  hygiene:
    name: Repo hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      # The `builtin` prek hooks only. The `local` hooks are language-specific
      # and run in the matrix jobs below against every supported toolchain
      # rather than once here.
      - name: prek builtin hooks
        run: |
          for hook in check-toml check-yaml end-of-file-fixer trailing-whitespace \
                      check-merge-conflict detect-private-key; do
            echo "::group::$hook"
            uv run --project sdks/python prek run --all-files "$hook"
            echo "::endgroup::"
          done

  typescript:
    name: TypeScript SDK (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["20", "22"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      # Mirrors `typescript-sdk-{lint,format,typecheck,tests,build}` in prek.toml.
      - name: ESLint
        run: npm run lint
      - name: Prettier check
        run: npm run format
      - name: Typecheck
        run: npm run typecheck
      # `npm run test` runs each workspace's suite and then the hermetic
      # cross-language contract tests in `tests/contract`.
      - name: Tests
        run: npm run test
      - name: Build
        run: npm run build

  python:
    name: Python SDK (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      # Mirrors `python-sdk-{ruff-check,ruff-format-check,ty-check,tests}` in
      # prek.toml. `--frozen` fails rather than silently resolving a different
      # dependency set than `uv.lock` pins.
      - name: Ruff lint
        run: >-
          uv run --project sdks/python --frozen
          ruff check --config sdks/python/pyproject.toml
          sdks/python/src sdks/python/tests examples/python tests/contract tools
      - name: Ruff format check
        run: >-
          uv run --project sdks/python --frozen
          ruff format --check --config sdks/python/pyproject.toml
          sdks/python/src sdks/python/tests examples/python tests/contract tools
      - name: ty typecheck
        run: >-
          uv run --project sdks/python --frozen
          ty check --project sdks/python
          sdks/python/src sdks/python/tests examples/python tests/contract
      - name: Tests
        run: >-
          uv run --project sdks/python --frozen
          pytest -c sdks/python/pyproject.toml sdks/python/tests
      # The Python half of the contract-conformance check. Hermetic: it reads
      # the committed snapshot, so it fails for exactly one reason — the SDK
      # and the contract disagree.
      - name: Contract conformance
        run: >-
          uv run --project sdks/python --frozen
          pytest -c sdks/python/pyproject.toml tests/contract

  contract:
    name: Contract and codegen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - run: npm ci
      # `npm run codegen` regenerates from the committed snapshot; stale
      # committed output means someone hand-edited generated code or bumped the
      # snapshot without regenerating.
      - name: Generated types are up to date
        run: npm run codegen:check
      # The drift alarm, and the one step here that touches the network: it
      # compares the contract `cdn.octogen.ai` is serving right now against the
      # committed snapshot. A newly published operation turns this red until
      # someone adds the SDK method — CI owns drift, and a red build names the
      # owner. Kept in its own job so it is obvious which of the two failed.
      - name: Published contract matches the snapshot
        run: npm run test:published-contract
