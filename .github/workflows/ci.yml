# Continuous integration for octogen-dev.
#
# Every command here is a command `prek.toml` also runs locally, so a green PR
# and a clean `prek run --all-files` mean the same thing. Hooks only protect the
# machines they are installed on; this workflow is what protects `main`.
name: CI

on:
  # Every pull request, not just those targeting `main`: a stacked PR is
  # exactly the change most likely to need checking, and filtering by target
  # branch silently gives it no CI at all.
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  hygiene:
    name: Repo hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      # The `builtin` prek hooks only. The `local` hooks are language-specific
      # and run in the matrix jobs below against every supported toolchain
      # rather than once here.
      - name: prek builtin hooks
        run: |
          for hook in check-toml check-yaml end-of-file-fixer trailing-whitespace \
                      check-merge-conflict detect-private-key; do
            echo "::group::$hook"
            uv run --project sdks/python prek run --all-files "$hook"
            echo "::endgroup::"
          done

  typescript:
    name: TypeScript SDK (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["20", "22"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      # Mirrors `typescript-sdk-{lint,format,typecheck,tests,build}` in prek.toml.
      #
      # Build first. The contract suite imports `@octogen-ai/sdk` through its
      # package entry point rather than from `src/`, deliberately — that is what
      # `npm install @octogen-ai/sdk` resolves — so on a fresh checkout there
      # are no types for ESLint to reason about until `dist/` exists.
      - name: Build
        run: npm run build
      - name: ESLint
        run: npm run lint
      - name: Prettier check
        run: npm run format
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm run test

  python:
    name: Python SDK (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      # Mirrors `python-sdk-{ruff-check,ruff-format-check,ty-check,tests}` in
      # prek.toml. `--frozen` fails rather than silently resolving a different
      # dependency set than `uv.lock` pins.
      - name: Ruff lint
        run: >-
          uv run --project sdks/python --frozen
          ruff check --config sdks/python/pyproject.toml
          sdks/python/src sdks/python/tests examples/python
      - name: Ruff format check
        run: >-
          uv run --project sdks/python --frozen
          ruff format --check --config sdks/python/pyproject.toml
          sdks/python/src sdks/python/tests examples/python
      - name: ty typecheck
        run: >-
          uv run --project sdks/python --frozen
          ty check --project sdks/python
          sdks/python/src sdks/python/tests examples/python
      - name: Tests
        run: >-
          uv run --project sdks/python --frozen
          pytest -c sdks/python/pyproject.toml sdks/python/tests

  contract:
    name: Contract conformance (live)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          python-version: "3.12"
      - run: npm ci

      # Regenerate every contract-derived artifact from the CDN, so the
      # conformance suites below run against what `/v1` publishes *right now*
      # rather than against what it published when this branch was written. A
      # newly published operation with no SDK method turns this job red, which
      # is the entire point: that is exactly how `POST /products/recrawl`
      # reached `main`. Running the real script also proves codegen still works.
      - name: Regenerate from the live contract
        run: npm run codegen
      - name: Report contract drift
        run: |
          if git diff --quiet; then
            echo "Committed artifacts match the live contract."
          else
            echo "::warning title=Contract drift::The live /v1 contract no longer" \
                 "matches the committed artifacts. Run 'npm run codegen' and" \
                 "commit the result."
            git --no-pager diff --stat
          fi

      - name: TypeScript conformance
        run: npm run test:contract
      - name: Python conformance
        run: >-
          uv run --project sdks/python --frozen
          pytest -c sdks/python/pyproject.toml tests/contract/python
