[project]
name = "octogen-ai-sdk"
version = "0.2.0"
description = "Async Python SDK for the Octogen AI commerce API"
readme = "README.md"
authors = [
    { name = "Octogen AI" }
]
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.0",
]

[project.optional-dependencies]
# BigQuery Analytics Hub subscribe helper (octogen_ai_sdk.bigquery). Optional so
# the core REST SDK stays dependency-light.
bigquery = [
    "google-cloud-bigquery-analyticshub>=0.9.0",
]

[project.scripts]
octogen-bq-subscribe = "octogen_ai_sdk._bigquery_cli:main"
octogen-bq-autosubscribe = "octogen_ai_sdk._bigquery_autosubscribe_cli:main"
octogen-mcp-login = "octogen_ai_sdk._mcp_login_cli:main"
octogen-url-lists = "octogen_ai_sdk._url_lists_cli:main"

[build-system]
requires = ["uv_build>=0.11.9,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "google-cloud-bigquery-analyticshub>=0.9.0",
    "prek>=0.3.13",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "respx>=0.23.1",
    "ruff>=0.15.12",
    "ty>=0.0.34",
]

[project.urls]
Homepage = "https://github.com/octogen-ai/octogen-dev"
Documentation = "https://api.octogen.ai/v1/docs"
Source = "https://github.com/octogen-ai/octogen-dev"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"
# `src/octogen_ai_sdk/generated` is emitted by `npm run codegen` from the
# published OpenAPI contract. It is still formatted (the codegen script runs
# `ruff format` over it) but not linted: its line lengths and naming come from
# the contract, and "fixing" them by hand would be undone by the next
# regeneration.
extend-exclude = ["**/octogen_ai_sdk/generated/**"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ty.src]
include = ["src", "tests"]
exclude = ["src/octogen_ai_sdk/generated"]

[tool.ty.environment]
python-version = "3.11"
