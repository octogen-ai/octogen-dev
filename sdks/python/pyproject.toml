[project]
name = "octogen-ai-sdk"
version = "0.3.0"
description = "Async Python SDK for the Octogen AI commerce API"
readme = "README.md"
authors = [
    { name = "Octogen AI" }
]
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.0",
]

[project.optional-dependencies]
# BigQuery Analytics Hub subscribe helper (octogen_ai_sdk.bigquery). Optional so
# the core REST SDK stays dependency-light.
bigquery = [
    "google-cloud-bigquery-analyticshub>=0.9.0",
]

[project.scripts]
octogen-bq-subscribe = "octogen_ai_sdk._bigquery_cli:main"
octogen-bq-autosubscribe = "octogen_ai_sdk._bigquery_autosubscribe_cli:main"
octogen-mcp-login = "octogen_ai_sdk._mcp_login_cli:main"
octogen-url-lists = "octogen_ai_sdk._url_lists_cli:main"

[build-system]
requires = ["uv_build>=0.11.9,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    # Pinned exactly: `tools/codegen/generate.py --check` compares generated
    # output byte-for-byte, so a minor bump in the generator reads as drift.
    "datamodel-code-generator==0.40.0",
    "google-cloud-bigquery-analyticshub>=0.9.0",
    "prek>=0.3.13",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "respx>=0.23.1",
    "ruff>=0.15.12",
    "ty>=0.0.34",
]

[project.urls]
Homepage = "https://github.com/octogen-ai/octogen-dev"
Documentation = "https://api.octogen.ai/v1/docs"
Source = "https://github.com/octogen-ai/octogen-dev"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# The generated contract mirror carries the API's own field descriptions
# verbatim, and several run past 88 columns. `ruff format` (which the generator
# runs) cannot split a string literal, and rewrapping them by hand would be
# undone by the next `npm run codegen`. Import order and the generator's fixed
# import list are its business too.
"**/octogen_ai_sdk/generated/*.py" = ["E501", "F401", "I001"]

[tool.ty.src]
include = ["src", "tests"]

[tool.ty.environment]
python-version = "3.11"

# The generated contract mirror is not hand-editable, so a diagnostic in it
# cannot be fixed here. One survives: `datamodel-code-generator` renders a
# schema's `default: {}` literally, so an object-typed field reads as
# `IdentifiersView | None = {}`. Pydantic coerces it at validation time;
# `ty` sees a `dict` assigned to a model. Everything hand-written stays checked.
[[tool.ty.overrides]]
include = ["src/octogen_ai_sdk/generated/**"]

[tool.ty.overrides.rules]
invalid-assignment = "ignore"
